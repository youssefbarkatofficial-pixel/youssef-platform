<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <link rel="manifest" href="./manifest.json">
    <meta charset="UTF-8">
    <title>Migrate Exam</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js?v=11"></script>
    <script src="js/firebase-service.js?v=11"></script>
    <link rel="icon" type="image/png" href="images/logo.png?v=11">
    <link rel="stylesheet" href="css/consistency.css?v=1">
</head>
<body style="font-family: sans-serif; text-align: center; padding: 50px;">
    <h1>���� �������...</h1>
    <p id="status">������ ��������</p>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const courses = await window.fbService.getCourses();
                const prep3 = courses.find(c => c.id === 'prep3');
                if (!prep3) {
                    document.getElementById('status').innerText = '�� ��� ������ ��� ���� prep3.';
                    return;
                }

                // Find the homework we want to copy
                let hwItem = null;
                for (const sec of prep3.sections) {
                    if (sec.items) {
                        const found = sec.items.find(i => i.title === '���� �������� ���������');
                        if (found) { hwItem = found; break; }
                    }
                }

                if (!hwItem) {
                    document.getElementById('status').innerText = '�� ��� ������ ��� ������ �����.';
                    return;
                }

                // Make sure Exams section exists
                let examsSec = prep3.sections.find(s => s.title === '����������' || s.id === 'exams-section');
                if (!examsSec) {
                    examsSec = { id: 'sec-' + Date.now(), title: '����������', items: [] };
                    prep3.sections.push(examsSec);
                }
                
                if (!examsSec.items) examsSec.items = [];

                // Check if already migrated
                const existingExam = examsSec.items.find(i => i.title === '������ �������� ���������');
                if (existingExam) {
                    document.getElementById('status').innerText = '�� ����� �������� ������.';
                    return;
                }

                // Next Wednesday at 9 PM
                const nextWed = new Date();
                nextWed.setDate(nextWed.getDate() + ((3 - nextWed.getDay() + 7) % 7 || 7)); // Next Wednesday
                nextWed.setHours(21, 0, 0, 0); // 9:00 PM

                // Clone the homework into an exam
                const newExam = JSON.parse(JSON.stringify(hwItem));
                newExam.id = 'exam-' + Date.now();
                newExam.title = '������ �������� ���������';
                newExam.type = 'exam';
                newExam.availableFrom = nextWed.toISOString();
                
                // Format questions to clearly show their type if they don't have it
                if (newExam.questions) {
                    newExam.questions.forEach(q => {
                        if (q.text) {
                            if (q.text.includes('�� ����') && !q.text.includes('[�� ����]')) {
                                q.text = '[�� ����] ' + q.text.replace('�� ����', '').trim();
                            } else if (q.text.includes('�� �������') && !q.text.includes('[�� �������]')) {
                                q.text = '[�� �������] ' + q.text.replace('�� �������', '').trim();
                            }
                        }
                    });
                }

                examsSec.items.push(newExam);
                
                await window.fbService.saveCourse(prep3);
                document.getElementById('status').innerHTML = '<b>�� �����! �� ����� ������ �������� ��������� ����� �������� 9 ������. ����� ��� ��� ����� ����.</b>';
            } catch (err) {
                console.error(err);
                document.getElementById('status').innerText = '��� ���: ' + err.message;
            }
        });
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration failed:', err));
            });
        }
    </script>
</body>
</html>
