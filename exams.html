    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let userStr = sessionStorage.getItem('currentStudent');
            if(!userStr) {
                window.location.href = 'index.html';
                return;
            }
            
            let user = JSON.parse(userStr);
            const nameEl = document.getElementById('userNameDisplay');
            const gradeEl = document.getElementById('userGradeDisplay');
            if(nameEl) nameEl.textContent = user.name;
            if(gradeEl) {
                const effectiveGrade = (window.getEffectiveStudentGrade && window.getGradeLabel)
                    ? window.getGradeLabel(window.getEffectiveStudentGrade(user))
                    : (user.grade || 'ÿ«·»');
                gradeEl.textContent = effectiveGrade || 'ÿ«·»';
            }
            
            let dbUser = JSON.parse(localStorage.getItem(`db_${user.phone}`)) || { courses: [] };
            const container = document.getElementById('examListContainer');
            const emptyState = document.getElementById('noExamState');
            
            if(dbUser.courses && dbUser.courses.length > 0) {
                container.style.display = 'block';
                emptyState.style.display = 'none';
                
                let adminCourses = JSON.parse(localStorage.getItem('adminCourses')) || [];
                
                dbUser.courses.forEach(cId => {
                    const c = adminCourses.find(course => course.id === cId);
                    if(c) {
                        const row = document.createElement('div');
                        row.className = 'course-exam-row';
                        
                        row.innerHTML = `
                            <div class="course-exam-header">
                                <div style="display: flex; align-items: center; gap: 15px;">
                                    <i class="fas fa-star text-gold" style="font-size: 1.5rem;"></i>
                                    <h3 style="margin: 0; color: var(--text-primary);">${c.title}</h3>
                                </div>
                                <button class="btn btn-outline toggle-btn">⁄—÷ «·«„ Õ«‰«  <i class="fas fa-chevron-down ml-2" style="margin-right: 8px;"></i></button>
                            </div>
                            <div class="course-exam-body">
                                <div class="exam-category">
                                    <h4 style="color: #2ecc71;"><i class="fas fa-check-circle"></i> «·«„ Õ«‰«  «·„ﬂ „·…</h4>
                                    <div class="empty-message">·«  ÊÃœ «„ Õ«‰«  „ﬂ „·… »⁄œ</div>
                                </div>
                                
                                <div class="exam-category">
                                    <h4 style="color: var(--accent-cyan);"><i class="fas fa-clock"></i> «·«„ Õ«‰«  «·„ «Õ…</h4>
                                    <div class="empty-message">·«  ÊÃœ «„ Õ«‰«  „ «Õ… «·¬‰</div>
                                </div>
                            </div>
                        `;
                        
                        const toggleBtn = row.querySelector('.toggle-btn');
                        toggleBtn.addEventListener('click', () => {
                            row.classList.toggle('active');
                            if(row.classList.contains('active')) {
                                toggleBtn.innerHTML = `≈Œ›«¡ «·«„ Õ«‰«  <i class="fas fa-chevron-up ml-2" style="margin-right: 8px;"></i>`;
                            } else {
                                toggleBtn.innerHTML = `⁄—÷ «·«„ Õ«‰«  <i class="fas fa-chevron-down ml-2" style="margin-right: 8px;"></i>`;
                            }
                        });
                        
                        container.appendChild(row);
                    }
                });
            } else {
                container.style.display = 'none';
                emptyState.style.display = 'block';
            }
        });
