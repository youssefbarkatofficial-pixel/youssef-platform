<!DOCTYPE html>
<html>
<head>
    <link rel="manifest" href="./manifest.json">
<script>
window.onerror = function(message, source, lineno, colno, error) {
    var errObj = {msg: message, src: source, line: lineno, col: colno};
    // attempt to write to a local file using a tiny local server? No.
    // just change document title so we can read it
    document.title = JSON.stringify(errObj);
};
</script>
<script src="js/bousala-intents.js?v=1.0"></script><script src="js/support-chat.js?v=9"></script>
<script>
window.onload = function() {
    if (document.title === "") document.title = "NO_ERROR";
};
</script>
</head>
<body>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration failed:', err));
            });
        }
    </script>
</body>
</html>
