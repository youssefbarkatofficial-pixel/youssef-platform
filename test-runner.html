<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

  <meta charset="UTF-8">
  <title>Bawsala Bot - Ultimate Quality & Stress Test</title>
  <style>
    body { font-family: Tahoma, Arial, sans-serif; padding: 40px; background: #f4f7f6; color: #333; line-height: 1.6; }
    h1, h2, h3 { color: #193d80; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .btn { padding: 12px 24px; background: #193d80; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px; font-weight: bold; }
    .btn:hover { background: #0b1d43; }
    .report { white-space: pre-wrap; font-family: monospace; background: #222; color: #0f0; padding: 20px; border-radius: 8px; max-height: 500px; overflow-y: auto; }

    .bot-reply { color: #2c3e50; font-weight: bold; padding: 10px; background: #ecf0f1; border-radius: 5px; display: inline-block; width: 100%; box-sizing: border-box; }
    .red-flag { color: #c0392b; font-weight: bold; }
  </style>
</head>
<body>

  <h1>ًں§ھ محرك التقييم الحقيقي: Bawsala Bot</h1>
  <p>يقوم هذا المحرك باختبار (الفهم والجودة والمشاعر والسياق) عبر 200 رسالة فوضوية و5 سيناريوهات ضط؛ط· متسلسلة.</p>
  
  <button id="runTestsBtn" class="btn">ًںڑ€ بدط، التشريح والاختبار الط¢ن</button>

  <div id="resultsArea" style="display:none;">
    <h2>ًں“ٹ ملخص الأداط، العام</h2>

    <h2>âڑ ï¸ڈ أقبح 20 رداظ‹ (Top 20 Worst Isolated Responses)</h2>

    <button id="downloadBtn" class="btn" style="background:#e67e22;">ًں“¥ تحميل التقرير النهائي (Markdown)</button>
    <button id="semanticBtn" class="btn" style="background:#9b59b6;">ًں§  تحميل تقرير فهم المعنى (Semantic Report)</button>
  </div>

  <script src="js/bousala-intents.js?v=1.0"></script><script src="js/support-chat.js?v=9"></script>
  <script>
    const ROBOTIC_RED_FLAGS = [

        "تصبح على خير", "عامل ايه يا بط·ل", "مساط، الفل", "يا ريت ترد بسرعة", "انا بحبك اوي",
        "ازيك يا هندسة", "تسلم ايدك", "ايه الاخبار", "اهلا بيك", "الف شكر", "يا سيدي متشكرين",
        "سلاموز", "انت بوت ولا انسان"
      ],

        "كلمني عن الزراعة في مصر", "يعني ايه ديمقراط·يةطں", "كم عدد المحافظات الساحليةطں", "ايه هي خط·وط· الط·ولطں",
        "دوائر العرض بتعمل ايهطں", "اشرحلي العصر القبط·ي", "ثورة 1919 حصلت ليهطں", "متى كانت حرب اكتوبرطں",
        "كلمني عن الاقتصاد المصري", "يعني ايه مواط·نةطں", "ايه حقوق الط·فلطں", "اهمية السد العاليطں",
        "اسباب التلوثطں", "مين بنى الاهراماتطں", "انجازات محمد علي في الجيشطں", "اسباب الحملة الفرنسيةطں"
      ],
      real_chaos: [
        "يعم انا تايه", "هو يعني ايه ده", "ط·ب لي", "مفهمتش", "احا مش فاهم حاجه", "امتحاني بكره",
        "يبوصله", "الدراسات رخمه", "منصه", "الكراس", "البصورةه", "مشعارف احل", "ياعم انجز",
        "عوز اشترك", "امتا الامتحان", "انا ضايع في المنهج", "يسط·ا انا تعبت", "تعبت من المذاكرة",
        "مشبيفتح", "مابيفتحش", "المنسه بايظه", "كمبيوتر", "خايف اسقط·", "خايفه", "فاشل",
        "ط·هقت", "ملل", "مكسل اذاكر", "مخنوق", "زفت", "ط؛بي", "مش داخله دماط؛ي", "عقدتي جط؛رافيا",
        "الخريط·ه معقده", "الامتحان بكرة ورعب", "عايز اقفل", "درجتي زفت", "قفلت الامتحان الحمدلله",
        "قفلت الامتحان", "انا الاول"
      ]
    };

    const CONVERSATION_SCENARIOS = [
      {
        name: "سيناريو 1: الاحتفاظ بالسياق (محمد علي + إحباط·)",
        messages: [
          { input: "مين هو محمد عليطں" },
          { input: "هو بنى جيش قوي ليهطں" },
          { input: "يعم انا خايف من الامتحان وحاسس اني هسقط·", expectEmpathy: true },
          { input: "المهم نرجع لموضوعنا.. هو اعتمد على مين في الجيشطں", checkContext: true },
          { input: "شكرا جدا ليك انا فهمت" }
        ]
      },
      {
        name: "سيناريو 2: اختبار الذاكرة العشوائية",
        messages: [
          { input: "صباح الفل" },
          { input: "اشرحلي تضاريس مصر" },
          { input: "ط·ب وهي مالها ومال تركز السكانطں", checkContext: true },
          { input: "على فكرة المنصة دي مش شط؛الة", expectFix: true },
          { input: "خلاص اشتط؛لت" }
        ]
      },
      {
        name: "سيناريو 3: التشتيت المتعمد (Chaos)",
        messages: [
          { input: "احا" },
          { input: "مش فاهم حاجه" },
          { input: "عن الحملة الفرنسية" },
          { input: "ط·ب لي بونابرت مشيطں", checkContext: true },
          { input: "باي" }
        ]
      }
    ];

    const SEMANTIC_VARIATIONS = {
      "محمد علي": [
        "مين هو محمد عليطں",
        "الراجل ده كان مينطں",
        "ط·ب ومحمد علي عمل ايهطں",
        "هو اللي بنى الجيشطں",
        "احكيلي عنه",
        "ط·ب ده جه امتىطں",
        "الراجل بتاع مصر الحديثة",
        "مش فاكر اسمه بس اللي عمل جيش",
        "محمدا علي",
        "عايز اعرف عن محمد على",
        "بتاع المذبحة صحطں",
        "هو مؤسس مصر الحديثهطں",
        "يعم قولي محمد علي مين",
        "باشا مصر",
        "محمدعلي"
      ],
      "تضاريس مصر": [
        "ايه هي تضاريس مصرطں",
        "جط؛رافية البلد دي عامله ازايطں",
        "يعني ايه تضاريسطں",
        "التضاريس بتاعة مصر",
        "تداريس مسر",
        "الجبال والهضاب اللي في مصر",
        "اشرحلي التضاريس",
        "الصحراط، الشرقية والط؛ربية والنيل",
        "شكل الأرض في مصر",
        "التضاريس رخمه فهمهالي",
        "تضاريس",
        "يعني ايه تضريس",
        "الوديان في مصر",
        "خريط·ة مصر تضاريسيا",
        "اراضي مصر"
      ]
    };

    let cases = [];
    ['chat', 'education', 'real_chaos'].forEach(cat => {
      TEST_CATEGORIES[cat].forEach(input => cases.push({ input, category: cat }));
      TEST_CATEGORIES[cat].forEach(input => cases.push({ input: input + ' ' + (Math.random()>0.5?'ياعم':'خالص'), category: cat }));
      TEST_CATEGORIES[cat].forEach(input => cases.push({ input: 'بقولك ' + input, category: cat }));
    });
    cases = cases.slice(0, 200); // 200 cases strictly

    let finalMdReport = '';
    let semanticMdReport = '';

    document.getElementById('runTestsBtn').addEventListener('click', () => {
      document.getElementById('runTestsBtn').innerText = 'âڈ³ جاري التشريح الشامل (قد يستط؛رق بضع ثوان)...';
      setTimeout(runAllTests, 500);
    });

    function checkQualityMetrics(botReply, userMessage, metrics, isStressTest = false) {
      let relevance = 10, naturalness = 10, humanScore = 10, continuity = 10, usefulness = 10;
      let reasons = [];

      let intent = metrics.Intent || 'UNKNOWN';
      let emotion = metrics.Emotion || 'NEUTRAL';
      let strategy = metrics.Strategy || 'UNKNOWN';

      // 1. Red Flags Check
      let hasRedFlag = false;
      ROBOTIC_RED_FLAGS.forEach(flag => {
        if (botReply.includes(flag)) {
          naturalness -= 4; humanScore -= 4; hasRedFlag = true;
          reasons.push('احتوى على Robotic Red Flag (' + flag + ')');
        }
      });

      // 2. Fallback Penalty
      if (strategy === 'fallback') {
        relevance -= 8; usefulness -= 8; continuity -= 5;
        reasons.push('المحرك استسلم للرد الجاهز (Fallback)');
      }

      // 3. Empathy Penalty (Very Strict)
      if ((emotion === 'ANXIETY' || emotion === 'FRUSTRATION') && strategy !== 'fallback') {
        const empatheticWords = ['حاسس بيك', 'ولا يهمك', 'ط·مني', 'بط·ل', 'استمر', 'متخافش', 'مش مقياس', 'عارف'];
        const isEmpathetic = empatheticWords.some(w => botReply.includes(w));
        if (!isEmpathetic) {
          humanScore -= 5; usefulness -= 3;
          reasons.push('تجاهل مشاعر الط·الب السلبية (انعدام التعاط·ف)');
        }
      }

      // 4. Formatting spam (Overuse of bold / emojis)
      if (botReply.includes('**') && userMessage.length < 20 && strategy === 'social') {
        naturalness -= 4;
        reasons.push('استخدام تنسيقات معقدة في محادثة بسيط·ة');
      }

      // 5. Length Check (Ignoring the user)
      if (userMessage.length > 30 && botReply.length < 15 && strategy !== 'clarification') {
        relevance -= 3; humanScore -= 3;
        reasons.push('الرد أقصر من اللازم وتجاهل نصف كلام المستخدم');
      }

      // Clamp
      relevance = Math.max(0, relevance); naturalness = Math.max(0, naturalness);
      humanScore = Math.max(0, humanScore); continuity = Math.max(0, continuity);
      usefulness = Math.max(0, usefulness);

      let overall = (relevance + naturalness + humanScore + continuity + usefulness) / 5;
      let status = overall >= 8 ? 'Passed' : overall >= 5 ? 'Partial' : 'Failed';

      return { scores: { relevance, naturalness, humanScore, continuity, usefulness, overall }, status, reasons, hasRedFlag };
    }

    function runAllTests() {
      let isolatedResults = [];
      let stressResults = [];

      // 1. ISOLATED TESTS (Memory Wiped)
      cases.forEach(tc => {
        localStorage.setItem('pf_brain_metrics', '[]');
        localStorage.setItem('bot_human_memory', '{"lastTopics":[]}');
        
        let replyText = getTemporarySafeBotReply(tc.input) || '';
        let metricsList = JSON.parse(localStorage.getItem('pf_brain_metrics') || '[]');
        let metrics = metricsList[metricsList.length - 1] || {};

        let evaluation = checkQualityMetrics(replyText, tc.input, metrics);
        
        isolatedResults.push({
          input: tc.input, category: tc.category, output: replyText,
          intent: metrics.Intent, purpose: metrics.Purpose, strategy: metrics.Strategy,
          ...evaluation
        });
      });

      // 2. CONVERSATION STRESS TESTS (Memory Kept)
      CONVERSATION_SCENARIOS.forEach(scenario => {
        localStorage.setItem('pf_brain_metrics', '[]');
        localStorage.setItem('bot_human_memory', '{"lastTopics":[]}');
        localStorage.setItem('pf_student_profile', '{}');
        
        let scenarioLog = [];
        let scenarioPassed = true;
        let contextLostAt = -1;

        scenario.messages.forEach((msg, idx) => {
          let replyText = getTemporarySafeBotReply(msg.input) || '';
          let metricsList = JSON.parse(localStorage.getItem('pf_brain_metrics') || '[]');
          let metrics = metricsList[metricsList.length - 1] || {};

          let evaluation = checkQualityMetrics(replyText, msg.input, metrics, true);
          
          if (msg.checkContext && (!metrics.MemoryUsed || metrics.Strategy === 'fallback')) {
             contextLostAt = idx + 1;
             scenarioPassed = false;
          }

          if (msg.expectEmpathy && evaluation.status === 'Failed') {
             scenarioPassed = false;
          }

          scenarioLog.push({
            input: msg.input, output: replyText, status: evaluation.status, contextLost: (contextLostAt === idx + 1)
          });
        });

        stressResults.push({ name: scenario.name, log: scenarioLog, passed: scenarioPassed, contextLostAt });
      });

      // 3. SEMANTIC UNDERSTANDING TEST
      let semanticLog = [];
      for (const [topic, variants] of Object.entries(SEMANTIC_VARIATIONS)) {
        let topicSuccess = 0;
        let variantLog = [];
        
        variants.forEach(variant => {
          localStorage.setItem('pf_brain_metrics', '[]');
          localStorage.setItem('bot_human_memory', '{"lastTopics":[]}');
          
          let replyText = getTemporarySafeBotReply(variant) || '';
          let metricsList = JSON.parse(localStorage.getItem('pf_brain_metrics') || '[]');
          let metrics = metricsList[metricsList.length - 1] || {};
          
          let extractedIntent = metrics.Intent || 'UNKNOWN';
          // Check if it successfully triggered an educational path and avoided Fallback
          let isSuccess = (extractedIntent === 'EDUCATIONAL' && metrics.Strategy !== 'fallback');
          
          if (isSuccess) topicSuccess++;
          
          variantLog.push({
            input: variant,
            intent: extractedIntent,
            strategy: metrics.Strategy || 'UNKNOWN',
            isSuccess,
            botReply: replyText
          });
        });
        
        semanticLog.push({ topic, total: variants.length, success: topicSuccess, variants: variantLog });
      }

      // Prepare UI Output
      isolatedResults.sort((a, b) => a.scores.overall - b.scores.overall);
      let worst20 = isolatedResults.slice(0, 20);

      renderResults(isolatedResults, worst20, stressResults, semanticLog);
    }

    function renderResults(isolated, worst, stress, semanticLog) {
      document.getElementById('resultsArea').style.display = 'block';
      document.getElementById('runTestsBtn').style.display = 'none';

      let passed = isolated.filter(r => r.status === 'Passed').length;
      let partial = isolated.filter(r => r.status === 'Partial').length;
      let failed = isolated.filter(r => r.status === 'Failed').length;

      document.getElementById('summary').innerHTML = `
        <div>
          <h3>ًں“ˆ Isolated Tests (200 Cases)</h3>
          <p style="color:green; font-weight:bold;">âœ… Passed: ${passed}</p>
          <p style="color:orange; font-weight:bold;">âڑ ï¸ڈ Partial: ${partial}</p>
          <p style="color:red; font-weight:bold;">â‌Œ Failed: ${failed}</p>
        </div>
        <div>
          <h3>ًں§  Conversation Stress Tests</h3>
          ${stress.map(s => `<p>${s.passed ? 'âœ…' : 'â‌Œ'} ${s.name} ${s.contextLostAt !== -1 ? '(Context Lost at Msg '+s.contextLostAt+')' : ''}</p>`).join('')}
        </div>
        <div>
          <h3>ًں§  Semantic Understanding Tests</h3>
          ${semanticLog.map(s => `<p>الموضوع (${s.topic}): نجح في فهم ${s.success} صيط؛ة من أصل ${s.total}</p>`).join('')}
        </div>
      `;

      let md = `# تقرير الجودة الشامل للبوصلة (Quality & Stress Test)\n\n`;
      md += `## 1. ملخص الأداط، للرسائل الفردية (200 رسالة)\n- âœ… نجاح: ${passed}\n- âڑ ï¸ڈ جزئي: ${partial}\n- â‌Œ فشل: ${failed}\n\n`;

      md += `## 2. اختبار المحادثات المتسلسلة (Conversation Stress Tests)\n`;
      let stressHtml = '';
      stress.forEach(s => {
        md += `### ${s.passed ? 'âœ…' : 'â‌Œ'} ${s.name}\n`;
        stressHtml += `<div class="stress-scenario ${s.passed ? 'passed' : 'failed'}">
          <h3>${s.passed ? 'âœ…' : 'â‌Œ'} ${s.name}</h3>`;
        s.log.forEach((l, i) => {
          md += `${i+1}. **User:** ${l.input}\n`;
          md += `   **Bot:** ${l.output.replace(/\\n/g, ' ')}\n`;
          if (l.contextLost) md += `   âڑ ï¸ڈ **فقد البوت السياق هنا!**\n`;
          
          stressHtml += `<p><strong>ًں§‘â€چًںژ“ الط·الب (${i+1}):</strong> ${l.input}</p>`;
          stressHtml += `<p class="bot-reply">ًں¤– البوصلة: ${l.output}</p>`;
          if (l.contextLost) stressHtml += `<p style="color:red; font-weight:bold;">âڑ ï¸ڈ البوت فقد سياق المحادثة في هذه الرسالة!</p>`;
        });
        md += `\n`;
        stressHtml += `</div>`;
      });
      document.getElementById('stressResults').innerHTML = stressHtml;

      md += `## 3. أقبح 20 رداظ‹ من أصل 200 (Worst Responses)\n\n`;
      let worstHtml = '';
      worst.forEach((w, i) => {
        let reasonText = w.reasons.length > 0 ? w.reasons.join('طŒ ') : 'رد ضعيف عام';
        
        worstHtml += `
          <div class="item ${w.status === 'Failed' ? 'failed' : 'partial'}">
            <p><strong>(${i+1}) الط·الب:</strong> ${w.input}</p>
            <p><strong>التصنيف:</strong> ${w.category}</p>
            <p><strong>الدرجة (Overall):</strong> ${w.scores.overall.toFixed(1)}/10</p>
            <p><strong>سبب الفشل:</strong> <span style="color:red">${reasonText}</span></p>
            <p class="bot-reply">ًں¤– البوصلة: ${w.output}</p>
          </div>
        `;

        md += `### ${i+1}. رسالة الط·الب: "${w.input}"\n`;
        md += `- **التصنيف:** ${w.category}\n`;
        md += `- **الدرجة:** ${w.scores.overall.toFixed(1)}/10\n`;
        md += `- **سبب الفشل:** ${reasonText}\n`;
        md += `- **رد البوت:**\n> ${w.output.replace(/\\n/g, '\n> ')}\n\n`;
      });

      document.getElementById('worst').innerHTML = worstHtml;
      finalMdReport = md;

      // Generate Semantic Report
      let semMd = `# تقرير الفهم الدلالي (Semantic Understanding Report)\n\n`;
      semMd += `هذا التقرير يختبر قدرة البوصلة على فهم (نفس المعنى) بصيط؛ مختلفة جداظ‹ (تتضمن عاميةطŒ نقص كلماتطŒ وأخط·اط، إملائية).\n\n`;
      
      semanticLog.forEach(s => {
        semMd += `## الموضوع الأصلي: [${s.topic}]\n`;
        semMd += `**النتيجة:** فهم البوت ${s.success} صيط؛ة من أصل ${s.total}\n\n`;
        
        s.variants.forEach(v => {
          semMd += `- **User:** "${v.input}"\n`;
          semMd += `  **Status:** ${v.isSuccess ? 'âœ… نجح في الفهم' : 'â‌Œ فشل (Fallback/Misinterpreted)'}\n`;
          semMd += `  **Bot Reply:** ${v.botReply.substring(0, 80).replace(/\\n/g, ' ')}...\n\n`;
        });
        semMd += `---\n\n`;
      });
      semanticMdReport = semMd;
    }

    document.getElementById('downloadBtn').addEventListener('click', () => {
      const blob = new Blob([finalMdReport], { type: 'text/markdown' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'bawsala_ultimate_test_report.md';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    });

    document.getElementById('semanticBtn').addEventListener('click', () => {
      const blob = new Blob([semanticMdReport], { type: 'text/markdown' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'semantic_understanding_report.md';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    });
  </script>
