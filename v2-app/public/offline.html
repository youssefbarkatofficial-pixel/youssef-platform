<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لا يوجد اتصال | يوسف بركات</title>
<style>
  :root{color-scheme:dark}
  html,body{height:100%;margin:0;background:#071226;color:#f5f1e6;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;
       padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
  .logo{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,#d4a64f,#f3d082,#b88a3a);display:grid;place-items:center;color:#071226;font-size:34px}
  h1{font-size:22px;margin:0}
  p{margin:0;color:#b9c0d0;line-height:1.8;max-width:32ch}
  button{margin-top:8px;border:0;border-radius:999px;padding:12px 28px;font-size:16px;font-weight:700;color:#071226;
         background:linear-gradient(135deg,#d4a64f,#f3d082,#b88a3a)}
</style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true">🧭</div>
  <h1>مفيش اتصال بالإنترنت</h1>
  <p>المنصة محتاجة نت عشان تحفظ إجاباتك ودرجاتك. اتأكد من الاتصال وجرّب تاني.</p>
  <button onclick="location.reload()">إعادة المحاولة</button>
</main>
</body>
</html>
