<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" fill="none">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="circleBg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1e3a66" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#0c1b33" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#071326" stop-opacity="1" />
    </radialGradient>
    
    <!-- Gold / Accent Rings Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4a64f" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#facc15" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.5" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Circle with Gradient -->
  <circle cx="250" cy="250" r="248" fill="url(#circleBg)" />

  <!-- Astrolabe / Compass Concentric Rings -->
  <circle cx="250" cy="250" r="235" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6" />
  <circle cx="250" cy="250" r="210" stroke="#d4a64f" stroke-width="1" opacity="0.3" />
  <circle cx="250" cy="250" r="175" stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="2 8" opacity="0.4" />
  <circle cx="250" cy="250" r="130" stroke="#d4a64f" stroke-width="1" opacity="0.25" />
  <circle cx="250" cy="250" r="85" stroke="#38bdf8" stroke-width="0.5" opacity="0.2" />

  <!-- Geographic Coordinate Grid Lines (Ellipses) -->
  <ellipse cx="250" cy="250" rx="230" ry="110" stroke="#ffffff" stroke-width="0.5" opacity="0.08" />
  <ellipse cx="250" cy="250" rx="230" ry="60" stroke="#ffffff" stroke-width="0.5" opacity="0.08" />
  <ellipse cx="250" cy="250" rx="110" ry="230" stroke="#ffffff" stroke-width="0.5" opacity="0.08" />
  <ellipse cx="250" cy="250" rx="60" ry="230" stroke="#ffffff" stroke-width="0.5" opacity="0.08" />

  <!-- Compass Starburst Rays -->
  <g opacity="0.18" stroke="url(#goldGrad)" stroke-width="1">
    <line x1="250" y1="15" x2="250" y2="485" />
    <line x1="15" y1="250" x2="485" y2="250" />
    <line x1="84" y1="84" x2="416" y2="416" stroke-dasharray="3 5" />
    <line x1="416" y1="84" x2="84" y2="416" stroke-dasharray="3 5" />
  </g>

  <!-- Small Celestial / Astrolabe Marker Pips -->
  <circle cx="250" cy="25" r="3" fill="#d4a64f" opacity="0.7" />
  <circle cx="250" cy="475" r="3" fill="#d4a64f" opacity="0.7" />
  <circle cx="25" cy="250" r="3" fill="#d4a64f" opacity="0.7" />
  <circle cx="475" cy="250" r="3" fill="#d4a64f" opacity="0.7" />
</svg>
