<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <link rel="manifest" href="./manifest.json">
    <meta charset="UTF-8">
    <title>ÅÕáÇÍ ÇáÅÔÚÇÑÇÊ</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
    
    <!-- Config -->
    <script src="js/firebase-config.js?v=11"></script>
    
    <style>
        body { font-family: Arial, sans-serif; padding: 50px; background: #111; color: #fff; }
        button { padding: 15px 30px; font-size: 1.2rem; cursor: pointer; }
    </style>
    <link rel="icon" type="image/png" href="images/logo.png?v=11">
</head>
<body>
    <h1>ÅÕáÇÍ ÅÔÚÇÑÇÊ ÊÚÏíá ÇáÏÑÌÉ ÇáŞÏíãÉ</h1>
    <button id="fixBtn">ÇÈÏÃ ÇáÅÕáÇÍ ÇáÂä</button>
    <p id="status"></p>

    <script>
        document.getElementById('fixBtn').addEventListener('click', async () => {
            const btn = document.getElementById('fixBtn');
            const status = document.getElementById('status');
            btn.disabled = true;
            status.innerHTML = 'ÌÇÑí ÇáÈÍË İí ŞÇÚÏÉ ÇáÈíÇäÇÊ...';
            
            try {
                const snapshot = await window.firebaseDb.collection('students').get();
                let updatedCount = 0;

                for (const doc of snapshot.docs) {
                    const data = doc.data();
                    let changed = false;
                    
                    if (data.notifications && Array.isArray(data.notifications)) {
                        const newNotifs = data.notifications.map(n => {
                            if (n.title && n.title.includes('ÊÚÏíá ÏÑÌÉ')) {
                                changed = true;
                                let type = 'ÇãÊÍÇä';
                                if (n.title.includes('ÊÏÑíÈ')) type = 'ÊÏÑíÈ';
                                if (n.title.includes('æÇÌÈ')) type = 'æÇÌÈ';
                                
                                return {
                                    title: `Êã ÅÚÇÏÉ ÊÕÍíÍ ${type}`,
                                    message: n.body || n.message || `Êã ÅÚÇÏÉ ÊÕÍíÍ ${type} ÇáÎÇÕ Èß æÊÚÏíá ÏÑÌÊß.`,
                                    timestamp: n.ts || n.timestamp || Date.now(),
                                    read: false,
                                    link: 'exams.html'
                                };
                            }
                            return n;
                        });

                        if (changed) {
                            await doc.ref.update({ notifications: newNotifs });
                            updatedCount++;
                            status.innerHTML += `<br>Êã ÊÍÏíË ÈíÇäÇÊ ÇáØÇáÈ ${data.name || doc.id}`;
                        }
                    }
                }
                
                status.innerHTML += `<br><br><b>ÇäÊåì! Êã ÊÍÏíË ÅÔÚÇÑÇÊ ${updatedCount} ØÇáÈ ÈäÌÇÍ.</b>`;
            } catch(e) {
                status.innerHTML += `<br><span style="color:red">ÎØÃ: ${e.message}</span>`;
            }
            
            btn.disabled = false;
        });
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration failed:', err));
            });
        }
    </script>
</body>
</html>
